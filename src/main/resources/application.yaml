server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/hmdp?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    consumer:
      group-id: voucher-order-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record
  jackson:
    default-property-inclusion: non_null

mybatis-plus:
  type-aliases-package: com.hmdp.entity

logging:
  level:
    com.hmdp: ${APP_LOG_LEVEL:debug}

hmdp:
  order:
    close-task-enabled: ${ORDER_CLOSE_TASK_ENABLED:true}
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    close-fixed-delay-ms: ${ORDER_CLOSE_FIXED_DELAY_MS:30000}
  cache:
    shop:
      maximum-size: ${SHOP_LOCAL_CACHE_MAXIMUM_SIZE:10000}
      expire-after-write-minutes: ${SHOP_LOCAL_CACHE_TTL_MINUTES:5}
  kafka:
    voucher-order-topic: ${VOUCHER_ORDER_TOPIC:hmdp.voucher-order}
    voucher-order-dlt-topic: ${VOUCHER_ORDER_DLT_TOPIC:hmdp.voucher-order.dlt}
    cache-invalidation-topic: ${CACHE_INVALIDATION_TOPIC:hmdp.cache-invalidation}
